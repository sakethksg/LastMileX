name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://mock-project.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key-ci"
      SUPABASE_SERVICE_ROLE_KEY: "mock-service-role-key-ci"
      DATABASE_URL: "postgresql://postgres:mock_ci_password@localhost:5432/lastmilex_ci?pgbouncer=true"
      DIRECT_URL: "postgresql://postgres:mock_ci_password@localhost:5432/lastmilex_ci"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NODE_ENV: "test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Run Vitest Suite
        run: npm run test

      - name: Next.js Production Build
        run: npm run build
